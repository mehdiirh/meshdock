[project]
name = "tunnel-manager"
version = "0.1.0"
description = "A visual, self-hosted tunnel control plane"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "cryptography>=44,<47", "argon2-cffi>=23.1,<26", "paramiko>=3.5,<5", "babel>=2.17,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2",
]
[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1", "black>=25,<27"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependencies intentionally use Depends() defaults.
