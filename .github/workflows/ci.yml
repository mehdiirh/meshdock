name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.14'
      - run: uv sync --project backend --frozen --python 3.12
      - run: uv run --project backend --no-sync python backend/compile_locales.py
      - run: uv run --project backend --no-sync black --config backend/pyproject.toml --check backend scripts
      - run: uv run --project backend --no-sync ruff check --config backend/pyproject.toml backend scripts
      - run: cd backend && uv run --no-sync pytest -q
      - name: Verify Linux range configurations and traffic in an isolated container
        run: |
          docker build -f backend/Dockerfile.network-test -t meshdock-network-test backend
          docker run --rm --privileged --network none meshdock-network-test uv run --no-sync pytest -q tests/test_socket_linux.py tests/test_gre_linux.py
      - run: python scripts/setup.py --demo && docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run format:check && npm run test && npm run build
      - run: cd frontend && npx playwright install --with-deps chromium && npm run test:e2e
