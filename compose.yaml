name: meshdock
x-backend: &backend
  build: ./backend
  image: meshdock-backend:local
  restart: unless-stopped
  volumes: [meshdock-data:/data]
  environment: &environment
    MESHDOCK_DATA_DIR: /data
    MESHDOCK_PUBLIC_ORIGIN: ${MESHDOCK_PUBLIC_ORIGIN:-http://localhost:8080}
    MESHDOCK_COOKIE_SECURE: ${MESHDOCK_COOKIE_SECURE:-true}
    MESHDOCK_DEMO: ${MESHDOCK_DEMO:-false}
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  stop_grace_period: 2m
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  api:
    <<: *backend
    environment:
      <<: *environment
      MESHDOCK_ADMIN_USERNAME: ${MESHDOCK_ADMIN_USERNAME:-admin}
      MESHDOCK_ADMIN_PASSWORD: ${MESHDOCK_ADMIN_PASSWORD:?Run scripts/setup.py first}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import sqlite3,time; d=sqlite3.connect('/data/meshdock.sqlite3'); r=d.execute('SELECT until FROM leader WHERE id=1').fetchone(); assert r and r[0]>time.time()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
  web:
    build: ./frontend
    image: meshdock-web:local
    restart: unless-stopped
    ports: ['127.0.0.1:${MESHDOCK_PORT:-8080}:8080']
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 20s
      timeout: 5s
      retries: 3
  tls:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    environment:
      MESHDOCK_DOMAIN: ${MESHDOCK_DOMAIN:-localhost}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
volumes:
  meshdock-data:
  caddy-data:
  caddy-config:
